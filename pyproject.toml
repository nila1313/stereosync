[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stereosync"
version = "0.1.0"
description = "Find the frame offset between two cameras from their ChArUco detections"
requires-python = ">=3.10"
# OpenCV (4.7 or newer, any variant such as opencv-contrib-python-headless) and numpy
# are needed but not listed, so pip does not replace the versions already in your environment.
dependencies = [
    "pyyaml",
    "bbo-calibcamlib",
]

[tool.setuptools.packages.find]
where = ["src"]
